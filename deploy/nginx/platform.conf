server {
    listen 80;
    server_name affsense.com www.affsense.com;
    return 301 https://affsense.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name affsense.com;

    ssl_certificate /etc/letsencrypt/live/affsense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/affsense.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # Runtime uploads (Next.js standalone does not serve new public/ files)
    location /uploads/ {
        alias /var/lib/cpl/platform-uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
