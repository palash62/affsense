name: Docker images (GHCR)

# Build Next.js off the 2GB VPS, verify standalone packaging, push to GHCR.
# Server then: bash deploy/docker-run.sh  (pull only)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run generate --workspace @cpl/database

      - name: Production build
        run: npm run build:production
        env:
          NODE_ENV: production
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
          AUTH_SECRET: ci-docker-build-placeholder-min-32-chars
          AUTH_URL: https://leadvix.io
          APP_URL: https://leadvix.io
          PLATFORM_URL: https://leadvix.io
          TRACKING_URL: https://leadgenlink.site
          NEXT_PUBLIC_PLATFORM_URL: https://leadvix.io
          NEXT_PUBLIC_TRACKING_URL: https://leadgenlink.site
          INTERNAL_SERVICE_TOKEN: ci-internal-service-token-placeholder

      - name: Prepare standalone
        run: bash deploy/prepare-standalone.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: meta
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "platform=ghcr.io/${OWNER_LC}/affsense-platform" >> "$GITHUB_OUTPUT"
          echo "tracking=ghcr.io/${OWNER_LC}/affsense-tracking" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Build platform (load only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.platform
          push: false
          load: true
          no-cache: true
          tags: |
            cpl-platform:ci
            ${{ steps.meta.outputs.platform }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.platform }}:latest

      - name: Build tracking (load only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tracking
          push: false
          load: true
          no-cache: true
          tags: |
            cpl-tracking:ci
            ${{ steps.meta.outputs.tracking }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.tracking }}:latest

      - name: Verify standalone images
        run: |
          bash deploy/verify-standalone-image.sh cpl-platform:ci platform
          bash deploy/verify-standalone-image.sh cpl-tracking:ci tracking

      - name: Push platform
        run: |
          docker push "${{ steps.meta.outputs.platform }}:${{ steps.meta.outputs.sha }}"
          docker push "${{ steps.meta.outputs.platform }}:latest"

      - name: Push tracking
        run: |
          docker push "${{ steps.meta.outputs.tracking }}:${{ steps.meta.outputs.sha }}"
          docker push "${{ steps.meta.outputs.tracking }}:latest"

      - name: Summary
        run: |
          echo "### Images pushed (after verify)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.platform }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.platform }}:${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.tracking }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.tracking }}:${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On the 2GB server: \`bash deploy/docker-run.sh\`" >> "$GITHUB_STEP_SUMMARY"
